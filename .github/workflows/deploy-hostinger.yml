name: Deploy global nginx

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy global nginx to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: proxy
          docker-compose-path: docker-compose.yml
          environment-variables: |
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            SITES=portfolio
            PORTFOLIO_DOMAIN=${{ vars.PORTFOLIO_DOMAIN || 'portfolio.bowang.tech' }}
            PORTFOLIO_ALIASES=${{ vars.PORTFOLIO_ALIASES }}
            PORTFOLIO_UPSTREAM=portfolio-app:8081
