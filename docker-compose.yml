services:
  nginx:
    build:
      context: .
    container_name: global-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      SITES: ${SITES:-portfolio}
      PORTFOLIO_DOMAIN: ${PORTFOLIO_DOMAIN:-portfolio.bowang.tech}
      PORTFOLIO_ALIASES: ${PORTFOLIO_ALIASES:-}
      PORTFOLIO_UPSTREAM: ${PORTFOLIO_UPSTREAM:-portfolio-app-1:8081}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - proxy

volumes:
  certbot_www:
  certbot_certs:

networks:
  proxy:
    name: proxy
